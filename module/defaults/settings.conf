# Tailscale Next settings. Apply with: tsctl restart
#
# This file is sourced by a root shell script: keep it to KEY=value lines.

# Networking mode:
#   userspace - no kernel interface; works everywhere, but Android apps
#               cannot reach the tailnet directly.
#   tun       - kernel tailscale0 interface (requires /dev/net/tun).
#   auto      - tun when /dev/net/tun exists, otherwise userspace.
TS_TUN_MODE=auto

# UDP port for WireGuard traffic. 0 picks a random port.
TS_PORT=41641

# Firewall backend for tailscaled: iptables, nftables or auto.
# Android kernels rarely ship nf_tables, so iptables is the safe choice.
TS_FIREWALL_MODE=iptables

# tailscaled log verbosity (0 is the default; higher is chattier).
TS_VERBOSE=0

# Extra flags appended to the tailscaled command line.
TS_EXTRA_ARGS=
