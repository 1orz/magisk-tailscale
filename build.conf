# Build configuration for tailscaled. Sourced by tools/build-go.sh.

# Target. Only Android arm64 is supported.
GOOS=linux
GOARCH=arm64

# Features compiled out of the binary (names from ./cmd/featuretags --list).
# Desktop/server integrations that cannot work on Android, plus
# clientupdate, since the module is updated through the root manager.
TS_OMIT_FEATURES="
aws
bird
clientupdate
cloud
flashappliance
identityfederation
kube
linuxdnsfight
networkmanager
resolved
sdnotify
synology
systray
tap
tpm
webbrowser
"
