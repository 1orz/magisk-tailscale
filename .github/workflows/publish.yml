# Reusable: given a built "module" artifact, commit the release metadata
# (upstream.lock, update.json, changelog.md), tag, and publish the release.
name: publish

on:
  workflow_call:
    inputs:
      ts_version:
        type: string
        required: true
      ts_commit:
        type: string
        required: true
      module_rev:
        type: string
        required: true
      reason:
        type: string
        required: true

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          name: module
          path: dist

      - name: Write release metadata
        id: meta
        env:
          TS_VERSION: ${{ inputs.ts_version }}
          TS_COMMIT: ${{ inputs.ts_commit }}
          MODULE_REV: ${{ inputs.module_rev }}
          REASON: ${{ inputs.reason }}
        run: |
          tools/write-lock.sh "$TS_VERSION" "$TS_COMMIT" "$MODULE_REV"
          tools/release-meta.sh "$REASON"
          echo "tag=v$TS_VERSION-r$MODULE_REV" >> "$GITHUB_OUTPUT"

      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*.zip

      - name: Commit and tag
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error::$TAG already exists"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add upstream.lock update.json changelog.md
          git commit -m "release: $TAG"
          git pull --rebase origin main
          git push origin HEAD:main
          git tag "$TAG"
          git push origin "$TAG"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          gh release create "$TAG" dist/*.zip dist/*.zip.sha256 \
            --verify-tag --title "Tailscale Next $TAG" --notes-file dist/notes.md
